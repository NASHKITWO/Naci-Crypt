  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NaciCrypt-debug-apk
          path: dist

      - name: Buat release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/app-debug.apk
          generate_release_notes: true
          body: |
            Naci-Crypt ${{ github.ref_name }}
            Web game: buka www/index.html di browser atau pakai APK di atas untuk Android.
